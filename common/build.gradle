plugins {
    id 'net.neoforged.moddev'
}

base {
    archivesName = 'adaptive-functional-storage-common'
}

neoForge {
    // Vanilla-mode: Minecraft classes without loader APIs for shared sources.
    neoFormVersion = neo_form_version
}

configurations {
    commonJava {
        canBeResolved = false
        canBeConsumed = true
    }
    commonResources {
        canBeResolved = false
        canBeConsumed = true
    }
}

artifacts {
    commonJava sourceSets.main.java.sourceDirectories.singleFile
    commonResources sourceSets.main.resources.sourceDirectories.singleFile
}
